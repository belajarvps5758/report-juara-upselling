<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Penjualan Harian Upselling & Crosselling</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; padding-top: 15px; padding-bottom: 30px; }
    .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .header-title { background: linear-gradient(135deg, #0d6efd, #0099ff); color: white; padding: 12px; border-radius: 12px 12px 0 0; text-align: center; font-weight: bold; }
    .btn-submit { background: linear-gradient(135deg, #198754, #28a745); border: none; }
    .btn-submit:hover { background: linear-gradient(135deg, #157347, #218838); }
    .date-info { font-size: 0.85rem; font-weight: normal; opacity: 0.95; margin-top: 4px; }
    .report-paper { background: #fff; border: 1px dashed #ccc; padding: 15px; font-family: 'Courier New', Courier, monospace; }
    .btn-whatsapp { background-color: #25d366; color: white; font-weight: bold; border: none; }
    .btn-whatsapp:hover { background-color: #20ba5a; color: white; }
    .btn-delete-row { padding: 2px 6px; font-size: 0.75rem; }
  </style>
</head>
<body>

<div class="container" style="max-width: 480px;">
  <div class="card">
    <div class="header-title">
      <h5 class="m-0 fw-bold">INPUT UPSELLING / CROSSELLING</h5>
      <p class="m-0" style="font-size: 0.8rem; opacity: 0.9;">Area Fajar - Kasir Dashboard</p>
      <div id="hariTanggal" class="date-info">Memuat tanggal...</div>
    </div>
    <div class="card-body p-3">
      
      <div id="notif" class="alert d-none" role="alert"></div>

      <form id="formPenjualan" onsubmit="handleFormSubmit(event)">
        
        <div class="bg-light p-3 rounded mb-2 border">
          <h6 class="text-muted mb-2 border-bottom pb-1" style="font-size: 0.85rem;">Identitas Kasir & Waktu</h6>
          
          <div class="mb-2">
            <label for="tanggalInput" class="form-label small fw-bold mb-1">Tanggal Input Data</label>
            <input type="date" class="form-control form-control-sm" id="tanggalInput" required>
          </div>

          <div class="mb-2">
            <label for="inisial" class="form-label small fw-bold mb-1">Inisial Kasir</label>
            <select class="form-select form-select-sm" id="inisial" required>
              <option value="" disabled selected>Memuat list kasir...</option>
            </select>
          </div>
          <div class="mb-1">
            <label class="form-label small fw-bold mb-1">Shift</label>
            <select class="form-select form-select-sm" id="shift" required>
              <option value="" disabled selected>-- Pilih Shift --</option>
              <option value="SH01">SH01</option>
              <option value="SH02">SH02</option>
            </select>
          </div>
        </div>

        <div class="p-3 rounded mb-3 border" style="background-color: #fff;">
          <h6 class="text-muted mb-2 border-bottom pb-1" style="font-size: 0.85rem;">Input Produk Terjual</h6>
          <div class="mb-2">
            <label for="sku" class="form-label small fw-bold mb-1">SKU / Barcode</label>
            <input type="text" class="form-control form-control-sm" id="sku" required placeholder="Masukkan kode SKU" onkeydown="handleSkuKeyDown(event)" autocomplete="off">
          </div>
          <div class="mb-1">
            <label for="qty" class="form-label small fw-bold mb-1">QTY</label>
            <input type="number" class="form-control form-control-sm" id="qty" min="1" value="1" required>
          </div>
        </div>

        <div class="row g-2">
          <div class="col-7">
            <button type="submit" id="btnSaves" class="btn btn-success btn-sm btn-submit fw-bold w-100 py-2">
              <span id="btnText">TAMBAH DATA</span>
              <span id="btnLoading" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
            </button>
          </div>
          <div class="col-5">
            <button type="button" class="btn btn-outline-primary btn-sm fw-bold w-100 py-2" data-bs-toggle="modal" data-bs-target="#modalReport" onclick="initReportForm()">
              📊 REPORT
            </button>
          </div>
        </div>

      </form>
    </div>
  </div>
</div>

<div class="modal fade" id="modalReport" tabindex="-1" aria-labelledby="modalReportLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="max-width: 460px; margin: auto;">
      <div class="modal-header bg-dark text-white py-2">
        <h6 class="modal-title" id="modalReportLabel">Cek Report Harian</h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-3">
        
        <div class="row g-2 mb-3 bg-light p-2 rounded border">
          <div class="col-6">
            <label class="form-label small fw-bold mb-1">Inisial</label>
            <select class="form-select form-select-sm" id="repInisial"></select>
          </div>
          <div class="col-6">
            <label class="form-label small fw-bold mb-1">Tanggal</label>
            <input type="date" class="form-control form-select-sm" id="repTanggal">
          </div>
          <div class="col-12 d-grid mt-2">
            <button type="button" class="btn btn-primary btn-sm fw-bold" id="btnCariReport" onclick="prosesAmbilReport()">PROSES CARI DATA</button>
          </div>
        </div>

        <div id="boxHasilReport" class="d-none">
          <div class="report-paper">
            <div class="text-center border-bottom pb-2 mb-2">
              <h6 class="fw-bold m-0" style="letter-spacing: 1px;">REPORT UPSELLING CROSSELLING</h6>
              <div id="lblRepHariTanggal" class="small text-secondary mt-1" style="font-size: 0.75rem;"></div>
            </div>
            
            <div class="mb-2" style="font-size: 0.8rem;">
              <div class="row"><div class="col-4 text-muted">Nama:</div><div class="col-8 fw-bold" id="lblRepNama"></div></div>
              <div class="row"><div class="col-4 text-muted">Store:</div><div class="col-8 fw-bold" id="lblRepStore"></div></div>
              <div class="row"><div class="col-4 text-muted">Shift:</div><div class="col-8 fw-bold" id="lblRepShift"></div></div>
            </div>

            <table class="table table-sm table-bordered m-0" style="font-size: 0.8rem;">
              <thead class="table-light text-center">
                <tr>
                  <th style="width: 35px;">NO</th>
                  <th>DESKRIPSI</th>
                  <th style="width: 45px;">QTY</th>
                  <th style="width: 40px;">AKSI</th>
                </tr>
              </thead>
              <tbody id="tbodyReport"></tbody>
            </table>
          </div>

          <div class="d-grid mt-2">
            <button type="button" class="btn btn-whatsapp btn-sm shadow-sm py-2" onclick="kirimKeWhatsApp()">
              🟢 KIRIM WA
            </button>
          </div>
        </div>
        
        <div id="loaderReport" class="text-center py-3 d-none">
          <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
          <p class="mt-1 text-muted small mb-0" style="font-size: 0.75rem;">Mencari data...</p>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // GANTI URL DI BAWAH DENGAN WEB APP URL GOOGLE APPS SCRIPT ANDA
  const GAS_API_URL = "GANTI_DENGAN_URL_WEB_APP_GAS_ANDA";

  var globalInisialList = [];
  var currentReportData = null; 
  var currentSelectedDateText = "";

  function handleSkuKeyDown(event) {
    if (event.key === "Enter" || event.keyCode === 13) {
      event.preventDefault(); 
      document.getElementById('qty').focus(); 
      document.getElementById('qty').select(); 
    }
  }

  function formatFormatIndo(dateObj) {
    var daftarHari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
    var daftarBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
    return daftarHari[dateObj.getDay()] + ", " + dateObj.getDate() + " " + daftarBulan[dateObj.getMonth()] + " " + dateObj.getFullYear();
  }

  function setTanggalDefaultHalamanUtama() {
    var hariIni = new Date();
    var yyyy = hariIni.getFullYear();
    var mm = String(hariIni.getMonth() + 1).padStart(2, '0');
    var dd = String(hariIni.getDate()).padStart(2, '0');
    document.getElementById('tanggalInput').value = yyyy + '-' + mm + '-' + dd;
  }

  function tampilkanTanggal() {
    try {
      document.getElementById('hariTanggal').innerText = formatFormatIndo(new Date());
    } catch(e) {
      console.log(e);
    }
  }

  function initReportForm() {
    var repInisial = document.getElementById('repInisial');
    repInisial.innerHTML = '';
    
    globalInisialList.forEach(function(nama) {
      var opt = document.createElement('option');
      opt.value = nama; opt.text = nama;
      repInisial.appendChild(opt);
    });
    
    var hariIni = new Date();
    var yyyy = hariIni.getFullYear();
    var mm = String(hariIni.getMonth() + 1).padStart(2, '0');
    var dd = String(hariIni.getDate()).padStart(2, '0');
    document.getElementById('repTanggal').value = yyyy + '-' + mm + '-' + dd;
    
    document.getElementById('boxHasilReport').classList.add('d-none');
    currentReportData = null;
  }

  function prosesAmbilReport() {
    var inisialInput = document.getElementById('repInisial').value;
    var tanggalInput = document.getElementById('repTanggal').value;
    
    if(!inisialInput || !tanggalInput) return alert("Pilih inisial dan tanggal!");

    document.getElementById('btnCariReport').disabled = true;
    document.getElementById('loaderReport').classList.remove('d-none');
    document.getElementById('boxHasilReport').classList.add('d-none');

    fetch(`${GAS_API_URL}?action=getReportData&inisial=${encodeURIComponent(inisialInput)}&tanggal=${encodeURIComponent(tanggalInput)}`)
      .then(response => response.json())
      .then(res => {
        document.getElementById('btnCariReport').disabled = false;
        document.getElementById('loaderReport').classList.add('d-none');

        if(res.success) {
          currentSelectedDateText = formatFormatIndo(new Date(tanggalInput));
          currentReportData = res; 

          document.getElementById('lblRepHariTanggal').innerText = currentSelectedDateText;
          document.getElementById('lblRepNama').innerText = res.meta.nama;
          document.getElementById('lblRepStore').innerText = res.meta.store;
          document.getElementById('lblRepShift').innerText = res.meta.shift;

          var tbody = document.getElementById('tbodyReport');
          tbody.innerHTML = '';

          if(res.table.length > 0) {
            res.table.forEach(function(item, index) {
              var nomorUrut = index + 1;
              var dsk = item.deskripsi.toUpperCase();
              var isBermasalah = (dsk === "" || dsk === "N/A" || dsk === "-" || dsk.includes("NOT FOUND") || dsk.includes("KOSONG"));
              
              var textDeskripsi = item.deskripsi;
              var rowStyle = "";
              if(isBermasalah) {
                textDeskripsi = "⚠️ [SKU SALAH / TIDAK DITEMUKAN]";
                rowStyle = "class='table-danger text-danger'";
              }

              var row = "<tr " + rowStyle + ">" +
                "<td class='text-center text-muted'>" + nomorUrut + "</td>" +
                "<td>" + textDeskripsi + "</td>" +
                "<td class='text-center fw-bold'>" + item.qty + "</td>" +
                "<td class='text-center'><button type='button' class='btn btn-danger btn-delete-row' onclick='eksekusiHapusData(" + item.rowNum + ")'>🗑️</button></td>" +
                "</tr>";
              tbody.innerHTML += row;
            });
          } else {
            tbody.innerHTML = "<tr><td colspan='4' class='text-center text-muted py-3'>Tidak ada data upselling.</td></tr>";
          }

          document.getElementById('boxHasilReport').classList.remove('d-none');
        } else {
          alert("Gagal membaca report: " + res.message);
        }
      })
      .catch(err => {
        document.getElementById('btnCariReport').disabled = false;
        document.getElementById('loaderReport').classList.add('d-none');
        alert("Error internal: " + err.toString());
      });
  }

  function eksekusiHapusData(nomorBaris) {
    if(!confirm("Apakah Anda yakin ingin menghapus baris data salah ini dari server?")) return;
    
    document.getElementById('boxHasilReport').classList.add('d-none');
    document.getElementById('loaderReport').classList.remove('d-none');
    
    fetch(GAS_API_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'hapusBarisForm', rowNum: nomorBaris })
    })
    .then(() => {
      alert("Permintaan hapus terkirim.");
      setTimeout(prosesAmbilReport, 1000);
    })
    .catch(err => {
      alert("Error: " + err.toString());
      document.getElementById('boxHasilReport').classList.remove('d-none');
      document.getElementById('loaderReport').classList.add('d-none');
    });
  }

  function kirimKeWhatsApp() {
    if (!currentReportData || currentReportData.table.length === 0) {
      alert("Tidak ada data produk!");
      return;
    }

    var adaDataZonk = false;
    var teksWA = "*REPORT UPSELLING*\n";
    teksWA += currentSelectedDateText + "\n\n";
    teksWA += "*Nama:* " + currentReportData.meta.nama + "\n";
    teksWA += "*Store:* " + currentReportData.meta.store + "\n";
    teksWA += "*Shift:* " + currentReportData.meta.shift + "\n\n";
    teksWA += "*DETAIL BARANG:*\n";
    teksWA += "--------------------------------------\n";

    currentReportData.table.forEach(function(item, index) {
      var no = index + 1;
      var dsk = item.deskripsi.toUpperCase();
      if(dsk === "" || dsk === "N/A" || dsk === "-" || dsk.includes("NOT FOUND") || dsk.includes("KOSONG")) {
        adaDataZonk = true;
      }
      teksWA += no + ". " + item.deskripsi + " -> *(" + item.qty + " Pcs)*\n";
    });
    
    teksWA += "--------------------------------------\n";
    teksWA += "_Terimakasih 🙏_";

    if(adaDataZonk) {
      if(!confirm("Peringatan: Ada item data yang kosong / tidak sempurna (N/A). Yakin tetap ingin kirim ke WA?")) {
        return;
      }
    }

    try {
      var teksAman = encodeURIComponent(teksWA);
      var urlWhatsApp = "https://wa.me/?text=" + teksAman;
      window.open(urlWhatsApp, '_blank');
    } catch (err) {
      alert("Gagal memproses teks WhatsApp: " + err.toString());
    }
  }

  window.onload = function() {
    tampilkanTanggal();
    setTanggalDefaultHalamanUtama();
    document.getElementById('sku').focus();
    
    var savedInisial = localStorage.getItem('saved_inisial');
    var savedShift = localStorage.getItem('saved_shift');
    if(savedShift) document.getElementById('shift').value = savedShift;

    var selectInisial = document.getElementById('inisial');
    
    fetch(`${GAS_API_URL}?action=getInisialList`)
      .then(response => response.json())
      .then(listInisial => {
        globalInisialList = listInisial; 
        selectInisial.innerHTML = '<option value="" disabled selected>-- Pilih Inisial --</option>';
        if (listInisial && listInisial.length > 0) {
          listInisial.forEach(function(nama) {
            var option = document.createElement('option');
            option.value = nama; option.text = nama;
            if(nama === savedInisial) option.selected = true;
            selectInisial.appendChild(option);
          });
        } else {
          selectInisial.innerHTML = '<option value="CADANGAN">KASIR UTAMA</option>';
        }
      })
      .catch(err => {
        selectInisial.innerHTML = '<option value="KASIR">KASIR UTAMA</option>';
      });
  };

  function handleFormSubmit(event) {
    event.preventDefault();
    var btnSaves = document.getElementById('btnSaves');
    var btnText = document.getElementById('btnText');
    var btnLoading = document.getElementById('btnLoading');
    var notif = document.getElementById('notif');
    
    btnSaves.disabled = true; btnText.innerText = "MENYIMPAN..."; btnLoading.classList.remove('d-none');
    
    var formData = {
      action: 'simpanData',
      tanggalInput: document.getElementById('tanggalInput').value,
      inisial: document.getElementById('inisial').value,
      shift: document.getElementById('shift').value,
      sku: document.getElementById('sku').value,
      qty: document.getElementById('qty').value
    };

    localStorage.setItem('saved_inisial', formData.inisial);
    localStorage.setItem('saved_shift', formData.shift);

    fetch(GAS_API_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(formData)
    })
    .then(() => {
      btnSaves.disabled = false; btnText.innerText = "TAMBAH DATA"; btnLoading.classList.add('d-none');
      notif.className = "alert alert-success"; 
      notif.innerText = "Data berhasil dikirim ke server!"; 
      notif.classList.remove('d-none');
      document.getElementById('sku').value = ""; 
      document.getElementById('qty').value = "1"; 
      document.getElementById('sku').focus();
      setTimeout(function() { notif.classList.add('d-none'); }, 3000);
    })
    .catch(error => {
      btnSaves.disabled = false; btnText.innerText = "TAMBAH DATA"; btnLoading.classList.add('d-none');
      notif.className = "alert alert-danger"; 
      notif.innerText = "Error Jaringan: " + error.toString(); 
      notif.classList.remove('d-none');
    });
  }
</script>

</body>
</html>
